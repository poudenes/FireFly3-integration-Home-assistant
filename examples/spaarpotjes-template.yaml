# Sjabloon voor custom:button-card: spaarpotjes van één Firefly III-groep.
#
# Zet dit blok bovenaan de ruwe dashboardconfiguratie
# (dashboard → ✏️ → ⋮ → Ruwe configuratie-editor), op hetzelfde niveau als `views:`.
# Gebruik het daarna per groep met `template: firefly_spaarpotjes` (zie spaarpotjes-card.yaml).
#
# Variabelen:
#   groep           (verplicht) groepsnaam precies zoals in Firefly III, incl. hoofdletters.
#                   Spaarpotjes zonder groep vallen onder "Overig".
#   toon_voortgang  true/false – voortgangsbalk per spaarpotje (standaard true).
#   toon_kop        true/false – grijze regel "<groep> · N spaarpotjes" boven het totaal (standaard false).
#   niet_in_totaal  lijst met spaarpotnamen die wel getoond, maar niet in het totaal/doel geteld worden.

button_card_templates:
  firefly_spaarpotjes:
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: none
    triggers_update: all
    variables:
      groep: Overig
      toon_voortgang: true
      toon_kop: false
      niet_in_totaal: []
    custom_fields:
      sp: |
        [[[
          return (function() {
            var groep = variables.groep;
            var toon = variables.toon_voortgang !== false;
            var uitsluiten = variables.niet_in_totaal || [];
            var eur = function(v) {
              return (parseFloat(v) || 0).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' });
            };

            var rows = [], gespaard = 0, doel = 0;
            Object.keys(states).forEach(function(e) {
              if (!e.startsWith('sensor.spaarpot_') || !e.endsWith('_gespaard')) return;
              var reg = hass.entities && hass.entities[e];
              if (!reg || reg.platform !== 'firefly3') return;
              var s = states[e];
              if (s.state === 'unavailable' || s.state === 'unknown') return;
              var a = s.attributes;
              if ((a.groep || 'Overig') !== groep) return;

              var dev = reg.device_id && hass.devices ? hass.devices[reg.device_id] : null;
              var naam = ((dev && (dev.name_by_user || dev.name)) || e).replace('Spaarpot ', '');
              var g = parseFloat(s.state) || 0;
              var d = a.doel != null ? parseFloat(a.doel) : null;
              var p = a.voortgang != null ? parseFloat(a.voortgang) : null;

              rows.push({ naam: naam, g: g, d: d, p: p, sort: p != null ? p : -1 });
              if (uitsluiten.indexOf(naam) === -1) {
                gespaard += g;
                if (d != null) doel += d;
              }
            });

            if (!rows.length) {
              return '<div style="color:#6C757D;font-size:13px;text-align:left;">Geen spaarpotjes gevonden in groep „' + groep + '”. Klopt de naam precies (ook hoofdletters)?</div>';
            }
            rows.sort(function(a, b) { return b.sort - a.sort; });

            var kleur = function(p) { return p >= 100 ? '#43A047' : '#4ECDC4'; };
            var grad = function(p) { return p >= 100 ? 'linear-gradient(90deg,#43A047,#388E3C)' : 'linear-gradient(90deg,#4ECDC4,#45B7AA)'; };
            var totPct = doel > 0 ? gespaard / doel * 100 : null;

            var h = '<div style="text-align:left;">';
            if (variables.toon_kop) {
              h += '<div style="color:#6C757D;font-size:11px;margin-bottom:4px;">' + groep + ' · ' + rows.length + ' spaarpotjes</div>';
            }
            h += '<div style="color:#4ECDC4;font-size:18px;font-weight:700;">' + eur(gespaard) + '</div>';
            if (doel > 0) {
              h += '<div style="color:#ADB5BD;font-size:12px;margin:2px 0 8px;">van ' + eur(doel) + ' · ' + Math.round(totPct) + '%</div>';
              h += '<div style="height:6px;background:#2B3035;border-radius:3px;overflow:hidden;margin-bottom:16px;">';
              h += '<div style="width:' + Math.min(100, totPct) + '%;height:100%;background:' + grad(totPct) + ';border-radius:3px;"></div>';
              h += '</div>';
            } else {
              h += '<div style="margin-bottom:14px;"></div>';
            }

            rows.forEach(function(r, i) {
              var last = i === rows.length - 1;
              h += '<div style="padding:7px 0;' + (last ? '' : 'border-bottom:1px solid #2B3035;') + '">';
              h += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;">';
              h += '<div style="color:#F8F9FA;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + r.naam + '</div>';
              h += '<div style="flex-shrink:0;font-size:13px;white-space:nowrap;">';
              h += '<span style="color:#F8F9FA;font-weight:600;">' + eur(r.g) + '</span>';
              h += '<span style="color:#6C757D;font-size:11px;"> / ' + (r.d != null ? eur(r.d) : '—') + '</span>';
              h += '</div>';
              h += '</div>';

              if (toon) {
                h += '<div style="display:flex;align-items:center;gap:8px;margin-top:5px;">';
                if (r.p != null) {
                  h += '<div style="flex:1;height:8px;background:#2B3035;border-radius:3px;overflow:hidden;">';
                  h += '<div style="width:' + Math.min(100, r.p) + '%;height:100%;background:' + grad(r.p) + ';border-radius:3px;"></div>';
                  h += '</div>';
                  h += '<div style="width:40px;flex-shrink:0;color:' + kleur(r.p) + ';font-size:11px;font-weight:600;text-align:right;">' + Math.round(r.p) + '%</div>';
                } else {
                  h += '<div style="color:#6C757D;font-size:11px;">geen doel ingesteld</div>';
                }
                h += '</div>';
              }
              h += '</div>';
            });

            h += '</div>';
            return h;
          })();
        ]]]
    styles:
      card:
        - padding: 18px
      grid:
        - grid-template-areas: '"sp"'
        - grid-template-columns: 1fr
      custom_fields:
        sp:
          - white-space: normal
          - text-align: left
