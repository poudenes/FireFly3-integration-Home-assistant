# Spaarpotjes van één groep, met het sjabloon uit spaarpotjes-template.yaml.
# Kopieer dit blok per groep en pas alleen de variabelen aan.

type: vertical-stack
title: Sparen vaste lasten
cards:
  - type: custom:button-card
    template: firefly_spaarpotjes
    variables:
      groep: Vaste lasten
      niet_in_totaal:
        - Boodschappen

