# Piggy banks of one group, using the template from spaarpotjes-template.yaml.
# Copy this block for each group and change only the variables.

type: vertical-stack
title: Sparen vaste lasten
cards:
  - type: custom:button-card
    template: firefly_spaarpotjes
    variables:
      groep: Vaste lasten
      niet_in_totaal:
        - Boodschappen

