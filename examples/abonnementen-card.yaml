# Maandelijkse uitgaven: abonnementen van deze maand (betaald / open / te laat) en later.
# Vereist: custom:button-card (HACS → Frontend).

type: vertical-stack
title: Maandelijkse uitgaven
cards:
  - type: custom:button-card
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: none
    triggers_update: all
    custom_fields:
      ab: |
        [[[
          return (function() {
            var eur = function(v) {
              return (parseFloat(v) || 0).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' });
            };
            var mnd = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
            var maanden = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
            var maand = maanden[new Date().getMonth()];
            var stat = {
              betaald: { label: 'Betaald', color: '#43A047' },
              open:    { label: 'Open',    color: '#ff0000' },
              te_laat: { label: 'Te laat', color: '#0000ff' }
            };

            var deze = [], later = [], betaald = 0, open = 0;
            Object.keys(states).forEach(function(e) {
              if (!e.startsWith('sensor.abonnement_') || !e.endsWith('_status')) return;
              var reg = hass.entities && hass.entities[e];
              if (!reg || reg.platform !== 'firefly3') return;
              var s = states[e];
              var st = s.state;
              if (['betaald', 'open', 'te_laat', 'niet_deze_maand'].indexOf(st) < 0) return;
              var a = s.attributes;

              var verwacht = ((parseFloat(a.bedrag_min) || 0) + (parseFloat(a.bedrag_max) || 0)) / 2;
              var bedrag = verwacht;
              if (st === 'betaald' && a.betaald_bedrag != null) {
                var b = parseFloat(a.betaald_bedrag);
                bedrag = isNaN(b) ? verwacht : b;
              }
              var dat = (st === 'betaald' ? a.betaald_op : a.verwachte_datum) || '9999-12-31';
              var dev = reg.device_id && hass.devices ? hass.devices[reg.device_id] : null;
              var naam = ((dev && (dev.name_by_user || dev.name)) || e).replace('Abonnement ', '');
              var row = { naam: naam, st: st, datum: dat, bedrag: bedrag };

              if (st === 'niet_deze_maand') {
                later.push(row);
              } else {
                deze.push(row);
                if (st === 'betaald') betaald += bedrag; else open += bedrag;
              }
            });

            var byDate = function(x, y) { return x.datum < y.datum ? -1 : x.datum > y.datum ? 1 : 0; };
            deze.sort(byDate);
            later.sort(byDate);

            var chip = function(d, color, dim) {
              var c = '<div style="width:38px;flex-shrink:0;text-align:center;border-radius:6px;padding:3px 0;background:#2B3035;' + (color ? 'border-left:3px solid ' + color + ';' : '') + (dim ? 'opacity:0.6;' : '') + '">';
              if (d && d.indexOf('9999') !== 0) {
                c += '<div style="color:#F8F9FA;font-size:14px;font-weight:700;line-height:1.1;">' + parseInt(d.slice(8, 10), 10) + '</div>';
                c += '<div style="color:#ADB5BD;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;">' + mnd[parseInt(d.slice(5, 7), 10) - 1] + '</div>';
              } else {
                c += '<div style="color:#6C757D;font-size:14px;line-height:2;">—</div>';
              }
              return c + '</div>';
            };

            var row = function(r, i, n, isLater) {
              var sc = stat[r.st];
              var h = '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;' + (i < n - 1 ? 'border-bottom:1px solid #2B3035;' : '') + '">';
              h += chip(r.datum, sc ? sc.color : null, isLater);
              h += '<div style="flex:1;min-width:0;color:' + (isLater ? '#ADB5BD' : '#F8F9FA') + ';font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + r.naam + '</div>';
              h += '<div style="flex-shrink:0;text-align:right;">';
              h += '<div style="color:' + (isLater ? '#ADB5BD' : '#F8F9FA') + ';font-size:13px;font-weight:600;white-space:nowrap;">' + eur(r.bedrag) + '</div>';
              if (sc) {
                h += '<div style="display:inline-block;margin-top:2px;background:' + sc.color + '26;color:' + sc.color + ';font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;">' + sc.label + '</div>';
              }
              h += '</div></div>';
              return h;
            };

            var section = function(label, color, count) {
              var h = '<div style="display:flex;align-items:center;gap:6px;margin:14px 0 4px;">';
              h += '<div style="width:8px;height:8px;border-radius:50%;background:' + color + ';"></div>';
              h += '<div style="color:#ADB5BD;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">' + label + '</div>';
              h += '<div style="color:#6C757D;font-size:11px;">· ' + count + '</div>';
              return h + '</div>';
            };

            var totaal = betaald + open;
            var pct = totaal > 0 ? betaald / totaal * 100 : 0;
            var teLaat = deze.filter(function(r) { return r.st === 'te_laat'; }).length;

            var h = '<div style="text-align:left;">';
            h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">';
            h += '<div style="color:#6C757D;font-size:11px;">Abonnementen · ' + maand + '</div>';
            if (teLaat) {
              h += '<div style="background:#E5393526;color:#E53935;font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;">' + teLaat + ' te laat</div>';
            }
            h += '</div>';
            h += '<div style="color:#4ECDC4;font-size:18px;font-weight:700;">' + eur(open) + ' <span style="color:#ADB5BD;font-size:12px;font-weight:400;">nog te betalen</span></div>';
            h += '<div style="color:#ADB5BD;font-size:12px;margin:2px 0 8px;">' + eur(betaald) + ' betaald van ' + eur(totaal) + '</div>';
            h += '<div style="height:6px;background:#2B3035;border-radius:3px;overflow:hidden;">';
            h += '<div style="width:' + pct + '%;height:100%;background:linear-gradient(90deg,#43A047,#388E3C);border-radius:3px;"></div>';
            h += '</div>';

            if (deze.length) {
              h += section('Deze maand', '#4ECDC4', deze.length);
              deze.forEach(function(r, i) { h += row(r, i, deze.length, false); });
            } else {
              h += '<div style="color:#6C757D;font-size:13px;margin-top:14px;">Geen abonnementen deze maand</div>';
            }

            if (later.length) {
              h += section('Later', '#6C757D', later.length);
              later.forEach(function(r, i) { h += row(r, i, later.length, true); });
            }

            h += '</div>';
            return h;
          })();
        ]]]
    styles:
      card:
        - padding: 18px
      grid:
        - grid-template-areas: '"ab"'
        - grid-template-columns: 1fr
      custom_fields:
        ab:
          - white-space: normal
          - text-align: left
